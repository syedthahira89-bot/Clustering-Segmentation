[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-crm-segmentation"
version = "0.1.0"
description = "Synthetic genomic and clinical patient segmentation demo"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
genomic-segmentation = "genomic_segmentation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["genomic_segmentation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
